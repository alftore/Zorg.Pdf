# Throwaway: finds why artifact uploads fail at startup in this repo. Removed in the next commit.
name: Probe c (upload-artifact v4.6.2)

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-c.yml]

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo probe > probe.txt
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: probe-c
          path: probe.txt
          retention-days: 1
