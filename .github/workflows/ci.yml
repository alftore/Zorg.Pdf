name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Zorg.Pdf.slnx -c Release

      - name: Test
        run: dotnet test --solution Zorg.Pdf.slnx -c Release --no-build

      - name: Pack
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -p:PackageOutputPath="$RUNNER_TEMP/packages"
          done

  # The library targets .NET 10; this runs its tests on the newest runtime, so a change there shows up here first.
  dotnet11:
    name: Tests on .NET 11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 11.0.x

      - name: Build
        run: dotnet build Zorg.Pdf.slnx -c Release

      - name: Test on the .NET 11 runtime
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: dotnet test --solution Zorg.Pdf.slnx -c Release --no-build

  # The same container as local runs: fonts and oracle tools (hb-shape, qpdf, poppler, MuPDF) are baked into
  # scripts/linux/Dockerfile.alpine, and veraPDF validates the tagged invoice as PDF/UA-1. ZORG_REQUIRE_FONTS=1 and
  # ZORG_REQUIRE_ORACLES=1 make a missing font or tool a failure, not a skip.
  oracles:
    name: Oracle tests (Alpine gate, veraPDF)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Linux gate
        env:
          ZORG_PDF_CONTAINER_CLI: docker
        run: scripts/test-linux.sh

  aot-smoke:
    name: AOT smoke publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      # DejaVu Sans is the font the sample renders with; ZORG_REQUIRE_FONTS=1 below makes its absence a failure.
      - name: Install Native AOT prerequisites and a font
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev fonts-dejavu-core

      # The explicit shell turns on pipefail, so a failed publish isn't hidden by tee.
      # A clean publish proves little on its own, so the sample is also run.
      - name: Publish
        shell: bash
        run: |
          dotnet publish samples/Zorg.Pdf.AotSmoke -r linux-x64 -c Release -o "$RUNNER_TEMP/aot" | tee "$RUNNER_TEMP/publish.log"
          if grep -E '\bIL[23][0-9]{3}\b' "$RUNNER_TEMP/publish.log"; then
            echo "::error::The publish reported trim or AOT warnings."
            exit 1
          fi

      - name: Run
        shell: bash
        env:
          ZORG_REQUIRE_FONTS: '1'
        run: '"$RUNNER_TEMP/aot/Zorg.Pdf.AotSmoke"'

  # The same document, data and font give the same bytes on every OS. Liberation Sans 2.1.5 (OFL 1.1) is fetched and
  # checked against a SHA-256 published independently of its upstream (Homebrew's font-liberation cask); the smoke
  # documents (text, tables, bands, images) are rendered and hashed on each OS, and the compare job fails on any
  # difference.
  determinism:
    name: Byte-identical output (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Fetch the pinned font
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/liberation.tar.gz" https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz
          echo "7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0  $RUNNER_TEMP/liberation.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/liberation.tar.gz" -C "$RUNNER_TEMP"

      - name: Render and hash
        shell: bash
        env:
          ZORG_PDF_TEST_FONT: ${{ runner.temp }}/liberation-fonts-ttf-2.1.5/LiberationSans-Regular.ttf
          ZORG_REQUIRE_FONTS: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          dotnet run --project samples/Zorg.Pdf.AotSmoke -c Release -- "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          sha256sum --binary *.pdf | tee "$RUNNER_TEMP/hashes-${{ matrix.os }}.txt"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hashes-${{ matrix.os }}
          path: ${{ runner.temp }}/hashes-${{ matrix.os }}.txt

  determinism-compare:
    name: Byte-identical output (compare)
    needs: determinism
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: hashes-*
          merge-multiple: true
          path: hashes

      - name: Compare
        run: |
          cat hashes/*.txt
          diff hashes/hashes-windows-latest.txt hashes/hashes-ubuntu-latest.txt
