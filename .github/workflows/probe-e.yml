# Throwaway: the determinism job's original upload, matrix and all. Removed in the next commit.
name: Probe e (matrix upload and download)

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-e.yml]

permissions:
  contents: read

jobs:
  upload:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - shell: bash
        run: echo probe > hashes-${{ matrix.os }}.txt
      - name: Upload the hashes
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-${{ matrix.os }}.txt
          if-no-files-found: error
          retention-days: 1

  compare:
    needs: [upload]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: hashes-*
          merge-multiple: true
      - run: cat hashes-*.txt
