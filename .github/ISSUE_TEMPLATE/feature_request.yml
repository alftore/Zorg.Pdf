name: Feature request
description: An element, option, standard or tool you'd like.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The core library stays managed code with no runtime packages. Features that need native code (a browser engine, Typst, PDFium) can only come as an opt-in add-on.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The element, option or standard, with a short example of the API or JSON you'd want.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: others
    attributes:
      label: What other tools do
      description: How jsreport, QuestPDF, Typst, pdfmake or others handle it, if you know.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
